# Validate data/ (SMILES, SDF, stereo checks, ids) on every pull request.
name: Check data

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/validate_data.py
      - run: python tests/test_series_parse.py
      - run: python tests/test_elements.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_assemble.mjs
