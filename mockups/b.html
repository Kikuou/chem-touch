<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>案B</title>
<link rel="stylesheet" href="common.css"><style>
:root{--bg:#F3F4F1;--accent:#2F6F4F;--accent-weak:#E2EDE5;--accent-ink:#1F4D36}
.wrap{padding:4px 16px 0}
.top{display:flex;justify-content:space-between;align-items:center;margin:10px 4px 16px}
.brand{font-size:22px;font-weight:700}
.btns{display:flex;gap:8px}
.cb{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--text);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t{background:var(--surface);border-radius:22px;padding:14px 14px 13px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.t h3{font-size:16px;font-weight:600}
.t p{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.big{grid-column:span 2;height:196px;background:#1D2421;color:#fff}
.big p{color:#AEB8B2}
.big .m{position:absolute;right:-6px;top:6px;width:230px;height:176px}
.big .m svg{width:100%;height:100%}
.big .go{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#1D2421;font-size:13px;font-weight:600;padding:9px 14px;border-radius:99px;align-self:flex-start}
.big .go svg{width:16px;height:16px}
.big .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;max-width:150px}
.big .chips span{font-size:11px;border:1px solid #3B4641;color:#CFD7D2;padding:3px 8px;border-radius:99px}
.sq{height:138px}
.tall{grid-row:span 2;height:286px}
.pt{color:var(--text);margin-top:10px}
.shell{display:grid;place-items:center;flex:1}
.shell svg{width:78px;height:78px}
.pair{display:flex;align-items:center;justify-content:center;gap:8px;flex:1}
.pair div{width:60px;height:54px}.pair div svg{width:100%;height:100%}
.pair i{display:block;width:0;height:46px;border-left:1.5px dashed #B7BEB9}
.chain svg{width:100%;height:60px}
.ic{width:30px;height:30px;border-radius:9px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center}
.ic svg{width:18px;height:18px}
.nav{position:absolute;left:0;right:0;bottom:0;height:92px;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-top:10px}
.nav div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#59605B;width:72px}
.nav div span{width:58px;height:30px;border-radius:15px;display:grid;place-items:center}
.nav div.on{color:var(--accent-ink);font-weight:600}
.nav div.on span{background:var(--accent-weak)}
</style></head><body>
<div class="status"><span>9:41</span><span class="r">●●●● <span class="bat"></span></span></div>
<div class="wrap">
 <div class="top"><div class="brand">ケミタッチ</div><div class="btns"><div class="cb"><i data-i="search"></i></div><div class="cb"><i data-i="qr"></i></div></div></div>

    </div></div>
   <div style="display:flex;flex-direction:column;gap:6px;margin-top:12px"><div style="font-size:11px;color:var(--muted)">傾向を見る</div><div style="font-size:12px;line-height:1.6;color:var(--text)">原子半径・電気陰性度</div></div></div>
  <div class="t sq"><div><h3>くらべる</h3><p>鏡像体・シス/トランス</p></div>

   <div class="shell"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="9" fill="var(--accent)"/><circle cx="50" cy="50" r="22" fill="none" stroke="#C9D2CC" stroke-width="1.5"/><circle cx="50" cy="50" r="36" fill="none" stroke="#C9D2CC" stroke-width="1.5"/><g fill="var(--text)"><circle cx="72" cy="50" r="3.6"/><circle cx="28" cy="50" r="3.6"/><circle cx="50" cy="14" r="3.6"/><circle cx="50" cy="86" r="3.6"/><circle cx="25.5" cy="25.5" r="3.6"/><circle cx="74.5" cy="74.5" r="3.6"/><circle cx="74.5" cy="25.5" r="3.6"/><circle cx="25.5" cy="74.5" r="3.6"/><circle cx="86" cy="50" r="3.6"/><circle cx="14" cy="50" r="3.6"/></g></svg></div></div>
  <div class="t" style="grid-column:span 2;height:92px;flex-direction:row;align-items:center;gap:12px">
   <div class="ic"><i data-i="build"></i></div><div style="flex:1"><h3>つくる</h3><p>炭素鎖に官能基をつける</p></div>
   <div class="chain" style="width:120px"><svg viewBox="0 0 132 50"><path d="M8 34l20-14 20 14 20-14 20 14 20-14" fill="none" stroke="#4B5563" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="104" y="14" font-size="11" fill="#E5484D" font-weight="700">OH</text></svg></div></div>
 </div>
</div>
