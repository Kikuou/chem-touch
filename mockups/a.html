<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>案A</title>
<link rel="stylesheet" href="common.css"><style>
.wrap{padding:6px 20px 0}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 0 14px}
h1{font-size:32px;font-weight:700;letter-spacing:.01em}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.search{display:flex;align-items:center;gap:10px;height:46px;background:#ECEEF1;border-radius:14px;padding:0 6px 0 14px;color:var(--muted);font-size:16px}
.search span{flex:1}
.search .qr{width:36px;height:36px;border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.label{font-size:13px;font-weight:600;color:var(--muted);margin:22px 4px 8px;display:flex;justify-content:space-between}
.label a{color:var(--accent);font-weight:500}
.feat{background:var(--surface);border-radius:20px;padding:14px 16px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.feat .m{width:150px;height:104px;flex:none;background:#F7F8FA;border-radius:14px;display:grid;place-items:center;padding:6px}
.feat .m svg{width:100%;height:100%}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--accent-weak);padding:3px 8px;border-radius:99px}
.feat h3{font-size:17px;margin:6px 0 4px}
.feat p{font-size:12.5px;line-height:1.55;color:var(--muted)}
.list{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;align-items:center;gap:13px;height:56px;padding:0 14px}
.row+.row .t{border-top:1px solid var(--line)}
.row .ic{width:34px;height:34px;border-radius:10px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center}
.row .ic svg{width:20px;height:20px}
.row .t{flex:1;height:56px;display:flex;align-items:center;justify-content:space-between;color:#B0B5BD}
.row .t b{color:var(--text);font-size:16px;font-weight:500}
.row .t small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
.tab{position:absolute;left:16px;right:16px;bottom:26px;height:62px;border-radius:31px;background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 24px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);display:flex;justify-content:space-around;align-items:center;padding:0 6px}
.tab div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#5B616B;width:72px;height:52px;justify-content:center;border-radius:26px}
.tab div.on{color:var(--accent);background:rgba(14,124,123,.10);font-weight:600}
.fade{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(transparent,var(--bg) 55%)}
</style></head><body>
<div class="status"><span>9:41</span><span class="r">●●●● <span class="bat"></span></span></div>
<div class="wrap">
 <div class="top"><div><h1>ケミタッチ</h1><div class="sub">化学を、さわって学ぶ</div></div><div class="avatar"><i data-i="star"></i></div></div>
 <div class="search"><i data-i="search"></i><span>分子・元素をさがす</span><div class="qr"><i data-i="qr"></i></div></div>
 <div class="label"><span>今日の分子</span><a>一覧</a></div>
 <div class="feat"><div class="m" data-mol="glu"></div><div><span class="tag">糖質</span><h3>α-グルコース</h3><p>デンプンをつくる単位。β型とくらべてみよう</p></div></div>
 <div class="label"><span>まなぶ</span></div>
 <div class="list">
  <div class="row"><div class="ic"><i data-i="hex"></i></div><div class="t"><b>分子をさわる<small>栄養・生体・医薬品など200種</small></b><i data-i="chev"></i></div></div>
  <div class="row"><div class="ic"><i data-i="compare"></i></div><div class="t"><b>くらべる<small>シス・トランス、鏡像体、異性体</small></b><i data-i="chev"></i></div></div>
  <div class="row"><div class="ic"><i data-i="build"></i></div><div class="t"><b>つくる<small>炭素をつないで官能基をつける</small></b><i data-i="chev"></i></div></div>
  <div class="row"><div class="ic"><i data-i="table"></i></div><div class="t"><b>周期表<small>傾向・ミネラル</small></b><i data-i="chev"></i></div></div>
  <div class="row"><div class="ic"><i data-i="shell"></i></div><div class="t"><b>電子配置<small>K殻・L殻・M殻に電子を置く</small></b><i data-i="chev"></i></div></div>
 </div>
</div>
<div class="fade"></div>
<div class="tab"><div class="on"><i data-i="home"></i>ホーム</div><div><i data-i="search"></i>さがす</div><div><i data-i="build"></i>つくる</div><div><i data-i="table"></i>周期表</div></div>
<div class="home-ind"></div>
<script src="icons.js"></script><script src="common.js"></script></body></html>
